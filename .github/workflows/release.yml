name: Release
on:
  push:
    branches: [main]
    paths: [ShardKeeper.toc]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Validate
        run: |
          luac5.1 -p ShardKeeper.lua ShardKeeperUI.lua
          lua5.1 tests/test_ui.lua
      - name: Package
        run: python3 tools/build_release.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^## Version: //p' ShardKeeper.toc | tr -d '\r')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no changes made."
            exit 0
          fi
          gh release create "$TAG" "dist/ShardKeeper-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "ShardKeeper $VERSION" \
            --notes-file "docs/release-$VERSION.md" --latest
